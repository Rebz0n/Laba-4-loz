name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/rebz0n/laba-4-loz:latest .
          docker tag ghcr.io/rebz0n/laba-4-loz:latest ghcr.io/rebz0n/laba-4-loz:${{ steps.vars.outputs.sha_short }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/rebz0n/laba-4-loz:latest
          docker push ghcr.io/rebz0n/laba-4-loz:${{ steps.vars.outputs.sha_short }}
